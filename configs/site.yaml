    image_points:
    - - 6.0
      - 348.0
    - - 128.0
      - 278.0
    - - 513.0
      - 317.0
    - - 456.0
      - 405.0
    image_size:
    - 632
    - 480
    hfov_deg: 70
signal:
  mode: adaptive
mcu:
  enabled: false
server:
  port: 8000
  stream_hz: 10
  mjpeg_fps: 4
log:
  dir: runs
